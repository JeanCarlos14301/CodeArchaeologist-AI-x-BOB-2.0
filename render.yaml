# Render Blueprint (J-03). Render builds the Dockerfile and redeploys on every push to main,
# only when the CI workflow (.github/workflows/ci.yml) passes. Steps: docs/deploy.md.
# How the app is published (API key, access and caps): docs/deploy.md.
services:
  - type: web
    name: codearchaeologist
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Set by hand in the Render dashboard; never in this file.
      - key: BOB_API_KEY
        sync: false
      # LIVE_AUDIT_TOKEN is intentionally absent: the public demo runs in open mode, so the judges can
      # use every live feature without asking for a token. To lock it (kill switch), add LIVE_AUDIT_TOKEN
      # with a long random value in the dashboard (Environment) and share it only privately.
      # The team already accepted the Bob Shell license when installing it; without this, `bob run`
      # fails in a non-interactive container.
      - key: BOB_ACCEPT_LICENSE
        value: "true"
      - key: ENABLE_DEV_CORS
        value: "false"
      # Spending caps for the public URL. Worst case: ~4 bobcoins per live audit
      # (3 from Bob + 1 from the architect), 0.8 per question and ~9 per full Studio run.
      - key: BOB_MAX_COST
        value: "3"
      - key: BOB_MAX_TURNS
        value: "30"
      - key: BOB_TIMEOUT_S
        value: "600"
      - key: MODERNIZE_PLAN_MAX_COST
        value: "1.5"
      - key: MODERNIZE_STEP_MAX_COST
        value: "2"
      - key: MODERNIZE_TOTAL_MAX_COST
        value: "4"
      - key: MODERNIZE_MAX_STEPS
        value: "5"
      # Daily guard for open mode: once the server has spent this many bobcoins today (UTC), live
      # features pause until tomorrow; the showcase keeps working. Adjust it to the account's budget.
      - key: BOB_DAILY_SPEND_LIMIT
        value: "15"
