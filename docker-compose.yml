# Local development of the single container (same Dockerfile as Render).
#   docker compose up --build   → http://127.0.0.1:8000
# Reads BOB_API_KEY and the other variables from .env when it exists (see .env.example).
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      # Named volume: keeps jobs.db and the dossiers across restarts
      # without permission problems for the container's non-root user.
      - artifacts:/app/artifacts

volumes:
  artifacts:
