[pytest]
testpaths = tests
addopts = -m "not live"
# `.` para los módulos importados como `app.*` y `..` (raíz del repo) para los importados
# como `backend.app.*`; conviven ambos estilos hasta unificarlos.
pythonpath = . ..
markers =
    live: invoca Bob Shell real (requiere BOB_API_KEY y consume bobcoins)
