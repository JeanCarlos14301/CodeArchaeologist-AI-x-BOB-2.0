[pytest]
testpaths = tests
addopts = -m "not live"
# `.` for modules imported as `app.*` and `..` (repo root) for modules imported
# as `backend.app.*`; both styles coexist until they are unified.
pythonpath = . ..
markers =
    live: invokes the real Bob Shell (requires BOB_API_KEY and spends bobcoins)
