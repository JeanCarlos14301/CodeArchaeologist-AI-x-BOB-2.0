# CI: mantiene main siempre desplegable (AGENTS.md). Render solo redespliega si esto pasa
# (render.yaml → autoDeployTrigger: checksPass). No usa BOB_API_KEY: las pruebas `live` se omiten.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest -m "not live"
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de la imagen (misma que usa Render)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: codearchaeologist:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prueba de humo del contenedor
        run: |
          docker run -d --name app -p 8000:8000 codearchaeologist:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/api/samples
          docker exec app bob --version
          docker logs app
